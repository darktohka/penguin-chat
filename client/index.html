<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Penguin Chat</title>
    <style>
      html, body { margin: 0; padding: 0; background: #EEEEEE; }
      body {
        min-height: 100vh;
        box-sizing: border-box;
        /* Margin around the game so it never sits flush against the window edge.
           Padding rather than margin on #app: it collapses gracefully and keeps
           the flex centering honest when the window is smaller than the game. */
        padding: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        /* Game sits at the top of the page, horizontally centered. */
        justify-content: flex-start;
        gap: 12px;
        font: 12px Arial, Helvetica, sans-serif;
      }
      /* Shrink-wrap the fixed 600x400 canvas main.ts creates. */
      #app { flex: none; line-height: 0; position: relative; }
      /* Page footer, matching rocketsnail.com. */
      #page-footer { flex: none; color: #666; text-align: center; }
      #page-footer a { color: #666; text-decoration: none; }
      #page-footer a:hover { color: #000; text-decoration: underline; }
      #page-footer .sep { margin: 0 6px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <footer id="page-footer">
      <a href="https://www.patreon.com/cw/rocketsnail" target="_blank" rel="noopener">Follow this project on Patreon</a>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
