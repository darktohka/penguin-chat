[package]
name = "penguinchat"
version = "1.20.2"
edition = "2021"
rust-version = "1.85"
description = "Self-hosted Penguin Chat server"
license = "MIT"
publish = false

[[bin]]
name = "penguinchat"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "cors"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
futures-util = "0.3.34"
tracing-appender = "0.2.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
